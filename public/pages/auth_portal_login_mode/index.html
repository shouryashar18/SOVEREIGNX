<style>
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(0, 219, 233, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 219, 233, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .glow-active {
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.1);
        }
        .btn-glow:hover {
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col relative overflow-hidden bg-grid-pattern antialiased">
<div class="absolute inset-0 bg-gradient-to-b from-primary-fixed-dim/5 to-transparent pointer-events-none"></div>
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop z-10 relative">
<div class="w-full max-w-[600px] bg-surface-container/60 backdrop-blur-xl border border-primary-fixed-dim/20 rounded-xl overflow-hidden shadow-2xl relative">
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary-fixed-dim/50 to-transparent"></div>
<div class="flex border-b border-outline-variant/30 text-center">
<a class="flex-1 py-4 text-on-surface-variant font-label-sm uppercase hover:text-primary-fixed transition-colors" href="register.html">REGISTER</a>
<div class="flex-1 py-4 text-primary-container font-label-sm uppercase font-bold border-b-2 border-primary-container bg-primary-fixed-dim/5 glow-active">LOGIN</div>
</div>
<div class="p-8 md:p-10 space-y-8">
<div class="flex flex-col items-center text-center space-y-4">
<div class="w-16 h-16 rounded-full bg-surface-container-highest border border-primary-fixed-dim/30 flex items-center justify-center text-primary-fixed-dim shadow-[0_0_15px_rgba(0,219,233,0.2)]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-primary-fixed-dim tracking-tight">LOGIN TO WORKSPACE</h1>
<p class="font-body-md text-on-surface-variant mt-2">Access your private organization environment</p>
</div>
</div>
<form class="space-y-6">
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant uppercase" for="email">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
<span class="material-symbols-outlined text-lg">mail</span>
</span>
<input class="w-full bg-surface-dim border border-outline-variant rounded-lg pl-10 pr-4 py-3 text-on-surface font-data-mono focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim transition-colors outline-none" id="email" placeholder="admin@organization.com" type="email">
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-sm text-primary-fixed-dim hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
<span class="material-symbols-outlined text-lg">key</span>
</span>
<input class="w-full bg-surface-dim border border-outline-variant rounded-lg pl-10 pr-10 py-3 text-on-surface font-data-mono focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim transition-colors outline-none" id="password" placeholder="••••••••••••" type="password">
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant hover:text-primary-fixed-dim transition-colors" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<a href="dashboard.html" class="w-full bg-primary-fixed-dim text-surface-container-lowest font-label-sm font-bold uppercase py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-primary-container transition-all btn-glow mt-8">
                        LOG IN
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</a>
</form>
<div class="text-center mt-6">
<p class="font-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="text-primary-fixed-dim hover:text-primary-container font-medium transition-colors border-b border-primary-fixed-dim/30 hover:border-primary-container pb-0.5" href="register.html">Register organization</a>
</p>
</div>
</div>
</div>
