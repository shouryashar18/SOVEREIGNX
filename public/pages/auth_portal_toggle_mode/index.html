<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SovereignX - Organization Access</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        rel="stylesheet">

    <style>
        body {
            background: #0a0f14;
            color: #dee3ea;
        }

        .input-box:focus-within {
            border-color: #00dbe9;
            box-shadow: 0 0 12px rgba(0, 219, 233, 0.2);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-3xl">

        <!-- HEADER -->
        <div class="text-center mb-8">

            <h1 class="text-4xl font-bold text-cyan-400">
                SOVEREIGNX
            </h1>

            <p class="text-gray-400 mt-2">
                Sovereign Industrial AI Workbench
            </p>

        </div>


        <!-- MAIN CARD -->
        <div class="bg-[#171c21] border border-gray-700 rounded-xl p-8 shadow-2xl">

            <!-- TABS -->
            <div class="flex mb-8 bg-[#0a0f14] rounded-lg p-1">

                <button
                    id="registerTab"
                    onclick="showRegister()"
                    class="w-1/2 py-3 rounded-lg bg-green-400 text-black font-bold">

                    REGISTER

                </button>

                <button
                    id="loginTab"
                    onclick="showLogin()"
                    class="w-1/2 py-3 rounded-lg text-gray-400">

                    LOGIN

                </button>

            </div>


            <!-- ================================================= -->
            <!-- REGISTER -->
            <!-- ================================================= -->

            <div id="registerSection">

                <h2 class="text-2xl font-bold text-cyan-400 mb-2">
                    REGISTER ORGANIZATION
                </h2>

                <p class="text-gray-400 mb-8">
                    Create your private industrial workspace
                </p>


                <div class="grid md:grid-cols-2 gap-5">

                    <!-- ORGANIZATION NAME -->
                    <div>

                        <label class="block text-sm text-gray-400 mb-2">
                            Organization Name
                        </label>

                        <input
                            id="orgName"
                            type="text"
                            placeholder="ABC Chemicals Pvt. Ltd."
                            class="input-box w-full bg-[#0f1419] border border-gray-700 rounded-lg p-4 outline-none">

                    </div>


                    <!-- EMAIL -->
                    <div>

                        <label class="block text-sm text-gray-400 mb-2">
                            Email
                        </label>

                        <input
                            id="email"
                            type="email"
                            placeholder="admin@company.com"
                            class="input-box w-full bg-[#0f1419] border border-gray-700 rounded-lg p-4 outline-none">

                    </div>


                    <!-- ORGANIZATION ID -->
                    <div>

                        <label class="block text-sm text-gray-400 mb-2">
                            Organization ID
                        </label>

                        <input
                            id="orgId"
                            type="text"
                            placeholder="ABC-CHEM-001"
                            class="input-box w-full bg-[#0f1419] border border-gray-700 rounded-lg p-4 outline-none">

                    </div>


                    <!-- ADMIN NAME -->
                    <div>

                        <label class="block text-sm text-gray-400 mb-2">
                            Admin Name
                        </label>

                        <input
                            id="adminName"
                            type="text"
                            placeholder="Admin Name"
                            class="input-box w-full bg-[#0f1419] border border-gray-700 rounded-lg p-4 outline-none">

                    </div>


                    <!-- PASSWORD -->
                    <div>

                        <label class="block text-sm text-gray-400 mb-2">
                            Password
                        </label>

                        <div class="relative">

                            <input
                                id="password"
                                type="password"
                                placeholder="Enter password"
                                class="input-box w-full bg-[#0f1419] border border-gray-700 rounded-lg p-4 pr-12 outline-none">

                            <button
                                type="button"
                                onclick="togglePassword('password','passwordIcon')"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">

                                <span
                                    id="passwordIcon"
                                    class="material-symbols-outlined">

                                    visibility

                                </span>

                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div>

                        <label class="block text-sm text-gray-400 mb-2">
                            Confirm Password
                        </label>

                        <div class="relative">

                            <input
                                id="confirmPassword"
                                type="password"
                                placeholder="Confirm password"
                                class="input-box w-full bg-[#0f1419] border border-gray-700 rounded-lg p-4 pr-12 outline-none">

                            <button
                                type="button"
                                onclick="togglePassword('confirmPassword','confirmIcon')"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">

                                <span
                                    id="confirmIcon"
                                    class="material-symbols-outlined">

                                    visibility

                                </span>

                            </button>

                        </div>

                    </div>


                    <!-- INDUSTRY -->
                    <div class="md:col-span-2">

                        <label class="block text-sm text-gray-400 mb-2">
                            Industry
                        </label>

                        <select
                            id="industry"
                            class="input-box w-full bg-[#0f1419] border border-gray-700 rounded-lg p-4 outline-none">

                            <option value="">
                                Select Industry
                            </option>

                            <option value="Chemical">
                                Chemical
                            </option>

                            <option value="Mechanical">
                                Mechanical
                            </option>

                            <option value="Electrical">
                                Electrical
                            </option>

                            <option value="Manufacturing">
                                Manufacturing
                            </option>

                            <option value="Mining">
                                Mining
                            </option>

                            <option value="Construction">
                                Construction
                            </option>

                            <option value="Energy">
                                Energy
                            </option>

                        </select>

                    </div>

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    id="registerBtn"
                    onclick="registerWorkspace()"
                    class="w-full mt-8 py-4 rounded-lg bg-green-400 text-black font-bold hover:bg-green-300 transition">

                    CREATE WORKSPACE

                </button>

            </div>


            <!-- ================================================= -->
            <!-- LOGIN -->
            <!-- ================================================= -->

            <div id="loginSection" class="hidden">

                <h2 class="text-2xl font-bold text-cyan-400 mb-2">
                    ORGANIZATION LOGIN
                </h2>

                <p class="text-gray-400 mb-8">
                    Access your secure industrial workspace
                </p>


                <!-- EMAIL -->

                <div class="mb-5">

                    <label class="block text-sm text-gray-400 mb-2">
                        Email
                    </label>

                    <input
                        id="loginEmail"
                        type="email"
                        placeholder="admin@company.com"
                        class="input-box w-full bg-[#0f1419] border border-gray-700 rounded-lg p-4 outline-none">

                </div>


                <!-- PASSWORD -->

                <div>

                    <label class="block text-sm text-gray-400 mb-2">
                        Password
                    </label>

                    <div class="relative">

                        <input
                            id="loginPassword"
                            type="password"
                            placeholder="Enter password"
                            class="input-box w-full bg-[#0f1419] border border-gray-700 rounded-lg p-4 pr-12 outline-none">

                        <button
                            type="button"
                            onclick="togglePassword('loginPassword','loginIcon')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">

                            <span
                                id="loginIcon"
                                class="material-symbols-outlined">

                                visibility

                            </span>

                        </button>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    id="loginBtn"
                    onclick="loginWorkspace()"
                    class="w-full mt-8 py-4 rounded-lg bg-cyan-400 text-black font-bold hover:bg-cyan-300 transition">

                    LOG IN

                </button>

            </div>

        </div>

    </div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL = "http://127.0.0.1:8000";


/* =====================================================
   TAB SWITCH
===================================================== */

function showRegister() {

    document
        .getElementById("registerSection")
        .classList.remove("hidden");

    document
        .getElementById("loginSection")
        .classList.add("hidden");

    document
        .getElementById("registerTab")
        .classList.add(
            "bg-green-400",
            "text-black"
        );

    document
        .getElementById("loginTab")
        .classList.remove(
            "bg-green-400",
            "text-black"
        );
}


function showLogin() {

    document
        .getElementById("loginSection")
        .classList.remove("hidden");

    document
        .getElementById("registerSection")
        .classList.add("hidden");

    document
        .getElementById("loginTab")
        .classList.add(
            "bg-green-400",
            "text-black"
        );

    document
        .getElementById("registerTab")
        .classList.remove(
            "bg-green-400",
            "text-black"
        );
}


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

function togglePassword(inputId, iconId) {

    const input =
        document.getElementById(inputId);

    const icon =
        document.getElementById(iconId);


    if (input.type === "password") {

        input.type = "text";

        icon.textContent =
            "visibility_off";

    }

    else {

        input.type = "password";

        icon.textContent =
            "visibility";

    }

}


/* =====================================================
   REGISTER WORKSPACE
===================================================== */

async function registerWorkspace() {

    const orgName =
        document
            .getElementById("orgName")
            .value
            .trim();

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const orgId =
        document
            .getElementById("orgId")
            .value
            .trim();

    const adminName =
        document
            .getElementById("adminName")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    const confirmPassword =
        document
            .getElementById("confirmPassword")
            .value;

    const industry =
        document
            .getElementById("industry")
            .value;


    /* VALIDATION */

    if (
        !orgName ||
        !email ||
        !orgId ||
        !adminName ||
        !password ||
        !confirmPassword ||
        !industry
    ) {

        alert("Please fill all fields.");

        return;

    }


    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;

    }


    try {

        const button =
            document.getElementById("registerBtn");

        button.innerText =
            "CREATING WORKSPACE...";

        button.disabled = true;


        const response =
            await fetch(
                `${API_URL}/workspaces/`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        name: orgName,

                        email: email,

                        organization_id: orgId,

                        password: password,

                        admin_name: adminName,

                        industry: industry

                    })

                }
            );


        const data =
            await response.json();


        console.log(
            "REGISTER RESPONSE:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Workspace registration failed"
            );

        }


        alert(
            "Workspace created successfully!"
        );


        /* SAVE EMAIL FOR LOGIN */

        document
            .getElementById("loginEmail")
            .value = email;


        /* CLEAR PASSWORD */

        document
            .getElementById("password")
            .value = "";

        document
            .getElementById("confirmPassword")
            .value = "";


        /* SHOW LOGIN */

        showLogin();

    }


    catch (error) {

        console.error(
            "REGISTER ERROR:",
            error
        );

        alert(
            "Registration failed: " +
            error.message
        );

    }


    finally {

        const button =
            document.getElementById("registerBtn");

        button.innerText =
            "CREATE WORKSPACE";

        button.disabled = false;

    }

}


/* =====================================================
   LOGIN WORKSPACE
===================================================== */

async function loginWorkspace() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    /* VALIDATION */

    if (!email || !password) {

        alert(
            "Please enter email and password."
        );

        return;

    }


    try {

        const button =
            document.getElementById("loginBtn");

        button.innerText =
            "LOGGING IN...";

        button.disabled = true;


        /* =================================================
           CALL BACKEND LOGIN
        ================================================= */

        const response =
            await fetch(
                `${API_URL}/workspaces/login`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        email: email,

                        password: password

                    })

                }
            );


        const data =
            await response.json();


        console.log(
            "LOGIN RESPONSE:",
            data
        );


        /* BACKEND ERROR */

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Invalid email or password"
            );

        }


        /* =================================================
           SAVE WORKSPACE INFORMATION
        ================================================= */

        localStorage.setItem(
            "workspace_id",
            data.workspace_id
        );

        localStorage.setItem(
            "organization_id",
            data.organization_id
        );

        localStorage.setItem(
            "workspace_name",
            data.name
        );

        localStorage.setItem(
            "workspace_email",
            data.email
        );

        localStorage.setItem(
            "admin_name",
            data.admin_name
        );

        localStorage.setItem(
            "industry",
            data.industry
        );


        /* =================================================
           LOGIN SUCCESS
        ================================================= */

        alert(
            "Login successful!"
        );


        /* =================================================
           IMPORTANT
           
           Login ke baad DIRECT industry selection page.
           
           chemical-dashboard.html ko yahan use nahi karna.
        ================================================= */

        window.location.href =
    "../industry_selection_portal/index.html";
    }


    catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );

        alert(
            "Login failed: " +
            error.message
        );

    }


    finally {

        const button =
            document.getElementById("loginBtn");

        button.innerText =
            "LOG IN";

        button.disabled = false;

    }

}

</script>

</body>
</html>
